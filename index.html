<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>근무 스케줄 앱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased selection:bg-blue-200">
  
  <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-10">
    <!-- 상단 헤더 -->
    <header class="px-5 py-4 flex justify-between items-center border-b border-gray-100">
      <h1 class="text-xl font-extrabold tracking-tight">내 스케줄</h1>
      <!-- 최상단 우측 오늘 스케줄 표기 배지 -->
      <div id="headerTeamBadge" class="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-xl text-sm font-extrabold shadow-sm border border-blue-100">
        -
      </div>
    </header>

    <!-- 중단: 오늘 & 내일 스케줄 비주얼 카드 영역 -->
    <section class="mt-6 px-5">
      <!-- 타이틀 및 설정 버튼 영역 -->
      <div class="flex justify-between items-center mb-3 relative">
        <h2 class="text-sm font-bold text-gray-700">근무 스케줄</h2>
        
        <!-- 설정 버튼 -->
        <div class="relative">
          <button id="settingsBtn" class="flex items-center gap-1.5 bg-gray-100 active:bg-gray-200 text-gray-700 px-4 py-2.5 rounded-xl text-sm font-bold transition-colors shadow-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
            </svg>
            기준 설정
          </button>
          
          <!-- 드롭다운 메뉴 -->
          <div id="settingsDropdown" class="hidden absolute right-0 top-11 w-48 bg-white border border-gray-100 rounded-2xl shadow-2xl z-50 overflow-hidden py-1">
            <div class="px-4 py-2.5 text-xs font-bold text-gray-400 bg-gray-50 border-b border-gray-100 text-center">
              이번 주(월요일) 나의 스케줄
            </div>
            <div class="flex flex-col p-1 gap-0.5">
              <button class="text-left px-4 py-2.5 text-sm font-medium rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors" onclick="setBaseSchedule(0)">1조 A조</button>
              <button class="text-left px-4 py-2.5 text-sm font-medium rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors" onclick="setBaseSchedule(1)">1조 P조</button>
              <button class="text-left px-4 py-2.5 text-sm font-medium rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors" onclick="setBaseSchedule(2)">2조 A조</button>
              <button class="text-left px-4 py-2.5 text-sm font-medium rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors" onclick="setBaseSchedule(3)">2조 P조</button>
              <button class="text-left px-4 py-2.5 text-sm font-medium rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors" onclick="setBaseSchedule(4)">3조 A조</button>
              <button class="text-left px-4 py-2.5 text-sm font-medium rounded-xl hover:bg-blue-50 hover:text-blue-600 transition-colors" onclick="setBaseSchedule(5)">3조 P조</button>
            </div>
          </div>
        </div>
      </div>

      <div class="flex gap-4 overflow-x-auto pb-4 snap-x hide-scrollbar">
        
        <!-- 오늘의 스케줄 카드 -->
        <div id="todayCardBg" class="snap-center shrink-0 w-[280px] bg-gradient-to-br rounded-2xl p-6 text-white shadow-md relative overflow-hidden transition-colors duration-300">
          <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -mr-10 -mt-10 pointer-events-none"></div>
          
          <div class="flex justify-between items-center mb-6 relative z-10">
            <span id="todayDateLabel" class="bg-white/20 px-3 py-1 rounded-full text-xs font-semibold">오늘</span>
            <span id="todayTeamBadge" class="text-sm font-bold bg-black/20 px-2.5 py-1 rounded-lg">-조 -조</span>
          </div>
          
          <div class="relative z-10">
            <p class="text-xs opacity-90 mb-1 font-semibold text-white/80">근무 시간</p>
            <h2 class="text-4xl font-bold tracking-tighter mb-5">
              <span id="todayStart">00:00</span><span class="text-xl font-normal opacity-70 mx-1">~</span><span id="todayEnd">00:00</span>
            </h2>
            
            <div class="flex gap-3 text-xs font-medium bg-black/15 rounded-xl p-2.5 w-fit backdrop-blur-sm" id="todayDetails">
            </div>
          </div>
        </div>

        <!-- 내일의 스케줄 카드 -->
        <div id="tomorrowCardBg" class="snap-center shrink-0 w-[280px] bg-gradient-to-br rounded-2xl p-6 text-white shadow-md relative overflow-hidden transition-colors duration-300">
          <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -mr-10 -mt-10 pointer-events-none"></div>
          
          <div class="flex justify-between items-center mb-6 relative z-10">
            <span id="tomorrowDateLabel" class="bg-white/20 px-3 py-1 rounded-full text-xs font-semibold">내일</span>
            <span id="tomorrowTeamBadge" class="text-sm font-bold bg-black/20 px-2.5 py-1 rounded-lg">-조 -조</span>
          </div>
          
          <div class="relative z-10">
            <p class="text-xs opacity-90 mb-1 font-semibold text-white/80">근무 시간</p>
            <h2 class="text-4xl font-bold tracking-tighter mb-5">
              <span id="tomorrowStart">00:00</span><span class="text-xl font-normal opacity-70 mx-1">~</span><span id="tomorrowEnd">00:00</span>
            </h2>
            
            <div class="flex gap-3 text-xs font-medium bg-black/15 rounded-xl p-2.5 w-fit backdrop-blur-sm" id="tomorrowDetails">
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- 하단: 캘린더 영역 -->
    <section class="mt-4 px-5">
      <div class="flex justify-between items-center mb-3">
        <!-- 연도/월 및 이동 화살표 -->
        <div class="flex items-center gap-3">
          <h3 id="calendarTitle" class="text-lg font-bold">2026년 7월</h3>
          <div class="flex items-center bg-gray-100 rounded-xl p-0.5">
            <button onclick="changeMonth(-1)" class="w-7 h-7 flex items-center justify-center text-gray-600 hover:bg-white rounded-lg transition-colors font-bold text-sm">〈</button>
            <button onclick="changeMonth(1)" class="w-7 h-7 flex items-center justify-center text-gray-600 hover:bg-white rounded-lg transition-colors font-bold text-sm">〉</button>
          </div>
        </div>
        
        <!-- 캘린더 조별 색상 범례 -->
        <div class="flex items-center gap-2.5 text-xs font-semibold text-gray-500">
          <div class="flex items-center gap-1">
            <div class="w-2.5 h-2.5 bg-red-500 rounded-full"></div>
            <span>1조</span>
          </div>
          <div class="flex items-center gap-1">
            <div class="w-2.5 h-2.5 bg-blue-500 rounded-full"></div>
            <span>2조</span>
          </div>
          <div class="flex items-center gap-1">
            <div class="w-2.5 h-2.5 bg-emerald-500 rounded-full"></div>
            <span>3조</span>
          </div>
        </div>
      </div>
      
      <div class="bg-gray-50 rounded-2xl p-4 border border-gray-100">
        <!-- 요일 헤더 -->
        <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-gray-400 mb-2">
          <div class="text-red-400">일</div>
          <div>월</div>
          <div>화</div>
          <div>수</div>
          <div>목</div>
          <div>금</div>
          <div class="text-blue-400">토</div>
        </div>
        
        <!-- 달력 날짜 그리드 -->
        <div id="calendarGrid" class="grid grid-cols-7 gap-1 text-center text-sm font-medium">
        </div>
      </div>
    </section>
  </div>

  <script>
    const scheduleData = {
      1: {
        A: { start: "06:20", end: "13:50", meal: "08:50", action: "🔄 교대 13:50" },
        P: { start: "13:50", end: "23:30", meal: "17:40", action: "🏠 능곡퇴근 23:30" }
      },
      2: {
        A: { start: "06:40", end: "14:10", meal: "09:10", action: "🔄 교대 14:10" },
        P: { start: "14:10", end: "23:40", meal: "18:00", action: "🏠 능곡퇴근 23:40" }
      },
      3: {
        A: { start: "07:00", end: "14:30", meal: "09:30", action: "🔄 교대 14:30" },
        P: { start: "14:30", end: "24:00", meal: "17:00", action: "🏠 능곡퇴근 24:00" }
      }
    };

    function getMondayTime(d) {
      const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff)).getTime();
    }

    let baseMondayTime = getMondayTime(new Date(2026, 6, 20)); 
    let baseCycleIndex = 3; // 기본 세팅 2조 P조 (인덱스 3)

    const savedMonday = localStorage.getItem('schedule_baseMondayTime');
    const savedCycle = localStorage.getItem('schedule_baseCycleIndex');
    if (savedMonday && savedCycle) {
      baseMondayTime = parseInt(savedMonday, 10);
      baseCycleIndex = parseInt(savedCycle, 10);
    }

    // 현재 캘린더에서 보고 있는 연도/월 상태 (기본 2026년 7월)
    let currentYear = 2026;
    let currentMonth = 6; // 0부터 시작하므로 6 = 7월

    function getScheduleInfo(targetDate) {
      const targetMondayTime = getMondayTime(targetDate);
      const diffWeeks = Math.round((targetMondayTime - baseMondayTime) / (7 * 24 * 60 * 60 * 1000));
      
      let currentCycle = (baseCycleIndex + diffWeeks) % 6;
      if (currentCycle < 0) currentCycle += 6;
      
      const team = Math.floor(currentCycle / 2) + 1;
      const shift = (currentCycle % 2 === 0) ? 'A' : 'P';
      
      return { team, shift };
    }

    function setBaseSchedule(selectedCycleIndex) {
      const today = new Date();
      const currentMondayTime = getMondayTime(today);
      
      localStorage.setItem('schedule_baseMondayTime', currentMondayTime.toString());
      localStorage.setItem('schedule_baseCycleIndex', selectedCycleIndex.toString());
      
      baseMondayTime = currentMondayTime;
      baseCycleIndex = selectedCycleIndex;
      
      document.getElementById('settingsDropdown').classList.add('hidden');
      updateUI();
    }

    document.getElementById('settingsBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('settingsDropdown').classList.toggle('hidden');
    });

    window.addEventListener('click', (e) => {
      if (!document.getElementById('settingsBtn').contains(e.target) && !document.getElementById('settingsDropdown').contains(e.target)) {
        document.getElementById('settingsDropdown').classList.add('hidden');
      }
    });

    function getCardGradient(team) {
      if (team === 1) return 'from-red-500 to-red-600';
      if (team === 2) return 'from-blue-500 to-blue-600';
      if (team === 3) return 'from-emerald-500 to-emerald-600';
      return 'from-gray-500 to-gray-600';
    }

    function changeMonth(direction) {
      currentMonth += direction;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      } else if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      renderCalendar(currentYear, currentMonth);
    }

    function updateUI() {
      const today = new Date(); 
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);

      const todayInfo = getScheduleInfo(today);
      const tomorrowInfo = getScheduleInfo(tomorrow);

      const todayData = scheduleData[todayInfo.team][todayInfo.shift];
      const tomorrowData = scheduleData[tomorrowInfo.team][tomorrowInfo.shift];

      document.getElementById('headerTeamBadge').innerText = `${todayInfo.team}조 ${todayInfo.shift}`;

      const todayCard = document.getElementById('todayCardBg');
      todayCard.className = `snap-center shrink-0 w-[280px] bg-gradient-to-br ${getCardGradient(todayInfo.team)} rounded-2xl p-6 text-white shadow-md relative overflow-hidden transition-colors duration-300`;
      
      document.getElementById('todayDateLabel').innerText = `오늘 (${today.getMonth()+1}/${today.getDate()})`;
      document.getElementById('todayTeamBadge').innerText = `${todayInfo.team}조 ${todayInfo.shift}조`;
      document.getElementById('todayStart').innerText = todayData.start;
      document.getElementById('todayEnd').innerText = todayData.end;
      document.getElementById('todayDetails').innerHTML = `<span>🍚 식사 ${todayData.meal}</span><span class="opacity-50">|</span><span>${todayData.action}</span>`;

      const tomorrowCard = document.getElementById('tomorrowCardBg');
      tomorrowCard.className = `snap-center shrink-0 w-[280px] bg-gradient-to-br ${getCardGradient(tomorrowInfo.team)} rounded-2xl p-6 text-white shadow-md relative overflow-hidden transition-colors duration-300`;

      document.getElementById('tomorrowDateLabel').innerText = `내일 (${tomorrow.getMonth()+1}/${tomorrow.getDate()})`;
      document.getElementById('tomorrowTeamBadge').innerText = `${tomorrowInfo.team}조 ${tomorrowInfo.shift}조`;
      document.getElementById('tomorrowStart').innerText = tomorrowData.start;
      document.getElementById('tomorrowEnd').innerText = tomorrowData.end;
      document.getElementById('tomorrowDetails').innerHTML = `<span>🍚 식사 ${tomorrowData.meal}</span><span class="opacity-50">|</span><span>${tomorrowData.action}</span>`;

      renderCalendar(currentYear, currentMonth);
    }

    function renderCalendar(year, month) {
      document.getElementById('calendarTitle').innerText = `${year}년 ${month + 1}월`;
      
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = ''; 
      
      const firstDay = new Date(year, month, 1).getDay(); 
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      
      const today = new Date();
      
      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="p-2"></div>`;
      }
      
      for (let day = 1; day <= daysInMonth; day++) {
        const currentDate = new Date(year, month, day);
        const info = getScheduleInfo(currentDate);
        const isToday = (day === today.getDate() && month === today.getMonth() && year === today.getFullYear());
        
        let colorClass = '';
        let dotColor = '';
        if (info.team === 1) {
          colorClass = 'text-red-500 font-bold bg-red-50';
          dotColor = 'bg-red-500';
        } else if (info.team === 2) {
          colorClass = 'text-blue-500 font-bold bg-blue-50';
          dotColor = 'bg-blue-500';
        } else if (info.team === 3) {
          colorClass = 'text-emerald-600 font-bold bg-emerald-50';
          dotColor = 'bg-emerald-500';
        }

        let dateHtml = `
          <div class="p-1.5 flex flex-col items-center justify-center gap-1 rounded-xl ${isToday ? 'ring-2 ring-blue-600 shadow-sm bg-white' : ''}">
            <span class="w-7 h-7 flex items-center justify-center rounded-lg text-xs ${colorClass}">${day}</span>
            <div class="w-1.5 h-1.5 ${dotColor} rounded-full"></div>
          </div>
        `;
        grid.innerHTML += dateHtml;
      }
    }

    updateUI();
  </script>
</body>
</html>
